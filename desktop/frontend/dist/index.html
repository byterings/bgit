<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bgit</title>
    <style>
      :root {
        color: #172033;
        background: #f8fafc;
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #d8dee8;
        --border-soft: #e2e8f0;
        --text: #172033;
        --muted: #64748b;
        --control-height: 36px;
        --radius: 8px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        min-height: 100vh;
      }
      .app-shell {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px 16px;
      }
      .brand {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
        padding: 0 8px;
      }
      .brand strong {
        color: #ffffff;
        font-size: 22px;
      }
      .brand span {
        color: #94a3b8;
        font-size: 13px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        justify-content: flex-start;
        width: 100%;
        border-color: transparent;
        background: transparent;
        color: #cbd5e1;
      }
      .nav button:hover,
      .nav button.active {
        border-color: rgb(148 163 184 / 0.24);
        background: rgb(255 255 255 / 0.08);
        color: #ffffff;
      }
      .content-shell {
        height: 100vh;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 32px 40px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--border);
        background: rgb(248 250 252 / 0.94);
        backdrop-filter: blur(10px);
      }
      .topbar-inner {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 32px;
      }
      .top-active {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .top-active-details {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .page-heading h1 {
        margin-bottom: 6px;
      }
      .page-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      header,
      .section-heading,
      .row-actions {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 16px;
        line-height: 1.3;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        line-height: 1.3;
      }
      p {
        margin: 0;
        color: #526071;
        line-height: 1.45;
      }
      button,
      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        min-height: var(--control-height);
        font: inherit;
        transition:
          border-color 140ms ease,
          background-color 140ms ease,
          box-shadow 140ms ease,
          opacity 140ms ease;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: #94a3b8;
        background: #f8fafc;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.08);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      button.primary {
        border-color: #172033;
        color: #ffffff;
        background: #172033;
      }
      button.primary:hover {
        border-color: #334155;
        background: #334155;
      }
      input {
        width: 100%;
        padding: 0 10px;
      }
      select {
        width: 100%;
        padding: 0 10px;
      }
      label {
        display: grid;
        gap: 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
      }
      input[type="checkbox"] {
        width: 16px;
        min-height: 16px;
      }
      .panel {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 20px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }
      .panel.active-card.active {
        border-color: #86efac;
        box-shadow: 0 0 0 3px rgb(134 239 172 / 0.22);
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .doctor-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .metric {
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        padding: 12px;
        min-height: 76px;
      }
      .metric strong {
        display: block;
        font-size: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .identity-card {
        display: grid;
        gap: 12px;
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 14px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background-color 160ms ease;
      }
      .identity-card.active {
        border-color: #86efac;
        background: #f0fdf4;
        box-shadow: inset 3px 0 0 #16a34a;
      }
      .card-actions {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .form-grid .wide {
        grid-column: 1 / -1;
      }
      .backup-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .backup-box {
        display: grid;
        gap: 12px;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        padding: 14px;
      }
      .backup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .backup-path,
      .backup-summary,
      .repo-path {
        border: 1px solid #e2e8f0;
        border-radius: var(--radius);
        background: #f8fafc;
        padding: 10px;
        color: #475569;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .warning-note {
        border: 1px solid #fde68a;
        border-radius: var(--radius);
        background: #fffbeb;
        color: #92400e;
        padding: 10px;
        line-height: 1.4;
      }
      .active-card,
      .stack {
        display: grid;
        gap: 10px;
      }
      .active-heading {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .active-name {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 22px;
        font-weight: 700;
      }
      .active-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #16a34a;
        box-shadow: 0 0 0 4px rgb(22 163 74 / 0.14);
      }
      .muted {
        color: #64748b;
      }
      .truncate {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        white-space: nowrap;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .message {
        margin-top: 16px;
        min-height: 20px;
        color: #166534;
      }
      .message.error {
        color: #b91c1c;
      }
      .toast-region {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 20;
        display: grid;
        width: min(420px, calc(100vw - 32px));
        gap: 10px;
      }
      .toast {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(15 23 42 / 0.12);
        padding: 12px;
        animation: toast-in 160ms ease-out;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .toast::before {
        content: "";
        width: 8px;
        height: 100%;
        min-height: 44px;
        border-radius: 999px;
        background: #16a34a;
      }
      .toast.warn::before {
        background: #d97706;
      }
      .toast.error::before {
        background: #dc2626;
      }
      .toast-title {
        margin-bottom: 4px;
        font-weight: 700;
      }
      .toast-message {
        color: #526071;
        line-height: 1.4;
      }
      .toast-close {
        min-width: 28px;
        min-height: 28px;
        padding: 0;
      }
      .action-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        color: #475569;
        font-size: 13px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e1;
        border-top-color: #172033;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .badge {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        min-width: 72px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        padding: 0 10px;
        font-size: 12px;
        color: #334155;
        background: #f8fafc;
      }
      .badge.active {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .badge.error {
        border-color: #fecaca;
        color: #991b1b;
        background: #fef2f2;
      }
      .badge.good {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .badge.warn {
        border-color: #fde68a;
        color: #92400e;
        background: #fffbeb;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .table th,
      .table td {
        border-top: 1px solid #eef2f7;
        padding: 14px 10px;
        text-align: left;
        vertical-align: middle;
      }
      .table th {
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      .table tr:first-child th {
        border-top: 0;
      }
      .table tbody tr {
        transition: background-color 140ms ease;
      }
      .table tbody tr:hover {
        background: #f8fafc;
      }
      .table tbody tr.active-row {
        background: #f0fdf4;
        box-shadow: inset 3px 0 0 #16a34a;
      }
      .identity-cell {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .identity-details {
        display: grid;
        gap: 4px;
        min-width: 0;
      }
      .identity-details strong {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .avatar {
        display: inline-grid;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        place-items: center;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #f8fafc;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
        overflow: hidden;
      }
      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .path {
        display: block;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .public-key-card {
        display: grid;
        gap: 8px;
        max-width: 100%;
      }
      .public-key-preview {
        display: block;
        max-width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        padding: 8px;
        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .key-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .icon-btn {
        width: 36px;
        min-width: 36px;
        padding: 0;
      }
      .icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        color: currentColor;
        flex: 0 0 16px;
      }
      .icon svg {
        display: block;
        width: 16px;
        height: 16px;
        stroke: currentColor;
      }
      .copyable {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 36px;
        gap: 8px;
        align-items: center;
        max-width: 100%;
      }
      .copyable .backup-path,
      .copyable .repo-path,
      .copyable code,
      .copyable span {
        min-width: 0;
      }
      .copy-btn.copied {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .binding-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 240px) auto auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 16px;
      }
      .detection-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 16px;
      }
      .detection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .detection-item {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
      }
      .detection-item span {
        display: block;
        margin-bottom: 4px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      .check-list {
        display: grid;
        gap: 18px;
      }
      .check-section {
        display: grid;
        gap: 10px;
        border: 1px solid #eef2f7;
        border-radius: var(--radius);
        padding: 12px;
      }
      .check-section h3 {
        margin: 0;
      }
      .check-row {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        border-top: 1px solid #eef2f7;
        padding-top: 10px;
      }
      .check-level {
        display: inline-flex;
        width: fit-content;
        min-height: 24px;
        align-items: center;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .check-level.pass {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .check-level.warn {
        border-color: #fde68a;
        color: #92400e;
        background: #fffbeb;
      }
      .check-level.fail {
        border-color: #fecaca;
        color: #991b1b;
        background: #fef2f2;
      }
      .check-fix {
        margin-top: 4px;
        color: #64748b;
      }
      .danger {
        border-color: #fecaca;
        color: #991b1b;
      }
      code {
        color: #334155;
      }
      .empty {
        min-height: 180px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      dialog {
        width: min(640px, calc(100vw - 32px));
        border: 1px solid #d8dee8;
        border-radius: 8px;
        padding: 0;
      }
      dialog::backdrop {
        background: rgb(15 23 42 / 0.28);
      }
      .dialog-body {
        padding: 20px;
      }
      .dialog-copy {
        margin: 10px 0 0;
        line-height: 1.5;
      }
      .dialog-warning {
        margin-top: 14px;
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        padding: 10px 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-width: 820px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          height: auto;
        }
        .content-shell {
          height: auto;
          overflow: visible;
        }
        .topbar {
          position: static;
        }
        .topbar-inner,
        main {
          padding-inline: 20px;
        }
        main {
          padding: 20px;
        }
        header,
        .section-heading,
        .row-actions {
          display: grid;
        }
        .grid,
        .form-grid,
        .backup-grid,
        .binding-form,
        .detection-form {
          grid-template-columns: 1fr;
        }
        .table {
          display: block;
          overflow-x: auto;
        }
        .toast-region {
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <strong>bgit</strong>
          <span>Identity manager</span>
        </div>
        <nav id="sidebarNav" class="nav" aria-label="Desktop navigation"></nav>
      </aside>
      <div id="contentShell" class="content-shell">
        <div id="topbar" class="topbar"></div>
        <main>
          <section id="app" class="panel">Loading...</section>
          <p id="message" class="message" aria-live="polite"></p>
        </main>
      </div>
    </div>
    <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="false"></div>

    <dialog id="addDialog">
      <form id="addForm" class="dialog-body" method="dialog">
        <h2>Add Identity</h2>
        <div class="form-grid">
          <label>
            Alias
            <input name="alias" autocomplete="off" required />
          </label>
          <label>
            GitHub username
            <input name="githubUsername" autocomplete="username" required />
          </label>
          <label>
            Name
            <input name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input name="email" autocomplete="email" required />
          </label>
          <label class="wide">
            Existing SSH private key path
            <input name="sshKeyPath" placeholder="Optional" />
          </label>
          <label class="check wide">
            <input name="generateSSHKey" type="checkbox" />
            Generate new SSH key
          </label>
        </div>
        <div class="dialog-actions">
          <button id="cancelAdd" type="button">Cancel</button>
          <button class="primary" type="submit">Add Identity</button>
        </div>
      </form>
    </dialog>

    <dialog id="editDialog">
      <form id="editForm" class="dialog-body" method="dialog">
        <h2>Edit Identity</h2>
        <input id="editAlias" name="alias" type="hidden" />
        <div class="form-grid">
          <label>
            Name
            <input id="editName" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input id="editEmail" name="email" autocomplete="email" required />
          </label>
          <label>
            GitHub username
            <input id="editGitHub" name="githubUsername" required />
          </label>
          <label>
            SSH private key path
            <input id="editSSHKey" name="sshKeyPath" />
          </label>
        </div>
        <div class="row-actions" style="margin-top: 18px">
          <button id="cancelEdit" type="button">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmDialog">
      <form id="confirmForm" class="dialog-body" method="dialog">
        <h2 id="confirmTitle">Confirm Action</h2>
        <p id="confirmMessage" class="dialog-copy"></p>
        <div id="confirmWarning" class="dialog-warning" hidden></div>
        <div class="dialog-actions">
          <button id="confirmCancel" type="button">Cancel</button>
          <button id="confirmAccept" class="primary" type="submit">Continue</button>
        </div>
      </form>
    </dialog>

    <script>
      const statusLabels = {
        available: "Available",
        missing: "Missing",
        not_configured: "Not configured",
        unknown: "Unknown",
      };
      const doctorLevelLabels = {
        pass: "Pass",
        warn: "Warn",
        fail: "Fail",
      };
      let currentStatus = null;
      let currentDoctor = null;
      let activeActionText = "";
      let toastCounter = 0;
      let lastExportPath = "";
      let lastImportPath = "";
      let selectedRepoPath = "";
      let selectedDetectPath = "";
      let currentDetection = null;
      let currentPage = "dashboard";
      const pages = [
        { id: "dashboard", label: "Dashboard", icon: "dashboard" },
        { id: "identities", label: "Identities", icon: "users" },
        { id: "bindings", label: "Repository Bindings", icon: "link" },
        { id: "backup", label: "Backup & Restore", icon: "archive" },
        { id: "doctor", label: "Doctor", icon: "shield" },
      ];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function api() {
        return window.go?.main?.App;
      }

      function setMessage(text, error = false, title = "") {
        const target = document.getElementById("message");
        target.textContent = text || "";
        target.classList.toggle("error", error);
        if (text) {
          notify({
            title: title || (error ? "Action failed" : "Done"),
            message: text,
            tone: error ? "error" : "success",
          });
        }
      }

      function notify({ title, message, tone = "success", timeout = 5200 }) {
        const region = document.getElementById("toasts");
        const id = `toast-${++toastCounter}`;
        const toast = document.createElement("div");
        toast.id = id;
        toast.className = `toast ${tone}`;
        toast.innerHTML = `
          <div>
            <div class="toast-title">${escapeHtml(title)}</div>
            <div class="toast-message">${escapeHtml(message)}</div>
          </div>
          <button class="toast-close" type="button" aria-label="Dismiss notification">×</button>
        `;
        region.appendChild(toast);
        const remove = () => toast.remove();
        toast.querySelector("button").addEventListener("click", remove);
        if (timeout > 0) {
          window.setTimeout(remove, timeout);
        }
      }

      function setActionText(text) {
        activeActionText = text || "";
        const note = document.getElementById("actionNote");
        if (note) {
          note.innerHTML = activeActionText
            ? `<span class="spinner" aria-hidden="true"></span>${escapeHtml(activeActionText)}`
            : "";
        }
      }

      function statusBadge(status) {
        const label = statusLabels[status] || "Unknown";
        const tone = status === "available" ? "good" : status === "missing" ? "warn" : "";
        return `<span class="badge ${tone}">${label}</span>`;
      }

      function iconSvg(name) {
        const icons = {
          edit: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
          trash: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
          copy: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
          check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
          refresh: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
          search: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
          sync: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 3v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 21v-5h5"/></svg>',
          folder: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
          use: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
          dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
          users: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>',
          link: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1"/></svg>',
          archive: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>',
          shield: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>',
        };
        return icons[name] || icons.check;
      }

      function iconButton({ action, icon, label, alias = "", path = "", disabled = false, danger = false }) {
        const attrs = [
          `type="button"`,
          `class="icon-btn ${danger ? "danger" : ""}"`,
          `data-action="${escapeHtml(action)}"`,
          `title="${escapeHtml(label)}"`,
          `aria-label="${escapeHtml(label)}"`,
          alias ? `data-alias="${escapeHtml(alias)}"` : "",
          path ? `data-path="${escapeHtml(path)}"` : "",
          disabled ? "disabled" : "",
        ]
          .filter(Boolean)
          .join(" ");
        return `<button ${attrs}><span class="icon" aria-hidden="true">${iconSvg(icon)}</span><span class="sr-only">${escapeHtml(label)}</span></button>`;
      }

      function copyButton(value, label = "Copy") {
        return iconButton({
          action: "copy-value",
          icon: "copy",
          label,
          path: value,
        }).replace("icon-btn", "icon-btn copy-btn");
      }

      function copyableValue(value, className = "", label = "Copy") {
        const safe = escapeHtml(value || "");
        return `
          <div class="copyable">
            <span class="${escapeHtml(className)} truncate" title="${safe}">${safe}</span>
            ${copyButton(value || "", label)}
          </div>
        `;
      }

      function renderNavigation() {
        const nav = document.getElementById("sidebarNav");
        nav.innerHTML = pages
          .map(
            (page) => `
              <button type="button" data-page="${escapeHtml(page.id)}" class="${currentPage === page.id ? "active" : ""}">
                <span class="icon" aria-hidden="true">${iconSvg(page.icon)}</span>
                ${escapeHtml(page.label)}
              </button>
            `,
          )
          .join("");
        nav.querySelectorAll("[data-page]").forEach((button) => {
          button.addEventListener("click", () => {
            currentPage = button.dataset.page || "dashboard";
            render(currentStatus, currentDoctor);
          });
        });
      }

      function renderTopbar(status, doctor) {
        const topbar = document.getElementById("topbar");
        const active = status?.activeIdentity;
        const health = doctor
          ? doctor.errors > 0
            ? "Errors"
            : doctor.warnings > 0
              ? "Warnings"
              : "Healthy"
          : "Not checked";
        topbar.innerHTML = `
          <div class="topbar-inner">
            <div class="top-active">
              ${active ? `<span class="active-dot" aria-hidden="true"></span>` : ""}
              <div class="top-active-details">
                <strong class="truncate" title="${escapeHtml(active?.alias || "No active identity")}">${escapeHtml(active?.alias || "No active identity")}</strong>
                <span class="muted truncate" title="${escapeHtml(active?.email || "Set an active identity")}">${escapeHtml(active?.email || "Set an active identity")}</span>
              </div>
            </div>
            <div class="top-actions">
              <span class="badge ${active ? "active" : "warn"}">${active ? "Active" : "No Active"}</span>
              <span class="badge">${status?.identityCount || 0} identities</span>
              <span class="badge">${status?.bindingCount || 0} bindings</span>
              <span class="badge ${doctor?.errors ? "error" : doctor?.warnings ? "warn" : "good"}">${escapeHtml(health)}</span>
              <button id="refresh" type="button" title="Refresh dashboard">
                <span class="icon" aria-hidden="true">${iconSvg("refresh")}</span>
                Refresh
              </button>
            </div>
          </div>
        `;
        document.getElementById("refresh").addEventListener("click", load);
      }

      function pageHeading(title, copy = "", actions = "") {
        return `
          <div class="page-heading">
            <div>
              <h1>${escapeHtml(title)}</h1>
              ${copy ? `<p>${escapeHtml(copy)}</p>` : ""}
            </div>
            ${actions ? `<div class="page-actions">${actions}</div>` : ""}
          </div>
        `;
      }

      function activePanel(status) {
        const active = status.activeIdentity;
        if (!active) {
          return `
            <section class="panel active-card">
              <h2>Active Profile</h2>
              <p class="muted">No active identity set.</p>
            </section>
          `;
        }
        const effective = status.effectiveIdentity;
        return `
          <section class="panel active-card active">
            <div class="active-heading">
              <h2>Active Profile</h2>
              <span class="badge active">Active</span>
            </div>
            <div class="active-name"><span class="active-dot" aria-hidden="true"></span>${escapeHtml(active.alias)}</div>
            <div>${escapeHtml(active.name)}</div>
            <div class="muted">${escapeHtml(active.email)}</div>
            <div class="muted">GitHub: ${escapeHtml(active.githubUsername)}</div>
            ${statusBadge(active.sshKeyStatus)}
            ${
              effective
                ? `<div class="muted">Effective source: ${escapeHtml(effective.source)}</div>`
                : ""
            }
          </section>
        `;
      }

      function addIdentityButton() {
        return `<button type="button" class="primary" data-action="open-add-identity"><span class="icon" aria-hidden="true">${iconSvg("users")}</span>Add Identity</button>`;
      }

      function backupPanel() {
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Backup & Restore</h2>
              </div>
            </div>
            <div class="backup-grid">
              <form id="exportForm" class="backup-box">
                <h3>Export Backup</h3>
                <div class="warning-note">Keep this password safe. It is required for import and cannot be recovered.</div>
                <label>
                  Export password
                  <input name="password" type="password" autocomplete="new-password" required />
                </label>
                <label>
                  Confirm password
                  <input name="confirmPassword" type="password" autocomplete="new-password" required />
                </label>
                <input name="outputPath" type="hidden" value="${escapeHtml(lastExportPath)}" />
                ${copyableValue(lastExportPath || "Default backup location", "backup-path", "Copy backup location")}
                <div class="backup-actions">
                  <button type="button" data-action="choose-export"><span class="icon" aria-hidden="true">${iconSvg("folder")}</span>Choose Location</button>
                  <button type="submit">Export</button>
                </div>
              </form>

              <form id="importForm" class="backup-box">
                <h3>Import Backup</h3>
                <div class="warning-note">Import replaces the current bgit configuration with the selected archive contents.</div>
                <input name="archivePath" type="hidden" value="${escapeHtml(lastImportPath)}" required />
                ${copyableValue(lastImportPath || "No archive selected", "backup-path", "Copy archive location")}
                <label>
                  Import password
                  <input name="password" type="password" autocomplete="current-password" required />
                </label>
                <div class="backup-actions">
                  <button type="button" data-action="choose-import"><span class="icon" aria-hidden="true">${iconSvg("folder")}</span>Choose Archive</button>
                  <button type="submit">Import</button>
                </div>
                <div id="importSummary" class="backup-summary" hidden></div>
              </form>
            </div>
          </section>
        `;
      }

      function repoBindingPanel(status) {
        const identities = status.identities || [];
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Repository Bindings</h2>
                <p>Pin local Git repositories to the identity they must use.</p>
              </div>
            </div>
            <form id="repoBindingForm" class="binding-form">
              <label>
                Repository path
                <input name="path" value="${escapeHtml(selectedRepoPath)}" placeholder="/path/to/git/repo" required />
              </label>
              <label>
                Identity
                <select name="alias" required ${identities.length === 0 ? "disabled" : ""}>
                  <option value="">Select identity</option>
                  ${identities
                    .map(
                      (identity) =>
                        `<option value="${escapeHtml(identity.alias)}">${escapeHtml(identity.alias)}</option>`,
                    )
                    .join("")}
                </select>
              </label>
              <button type="button" data-action="choose-repo"><span class="icon" aria-hidden="true">${iconSvg("folder")}</span>Choose Repo</button>
              <button type="submit" class="primary" ${identities.length === 0 ? "disabled" : ""}>Bind</button>
            </form>
            ${repoBindingRows(status.bindings || [])}
          </section>
        `;
      }

      function repoBindingRows(bindings) {
        if (bindings.length === 0) {
          return `<div class="empty"><p>No repository bindings configured.</p></div>`;
        }
        return `
          <table class="table">
            <thead>
              <tr>
                <th>Repository</th>
                <th>Identity</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${bindings
                .map(
                  (binding) => `
                    <tr>
                      <td>${copyableValue(binding.path, "repo-path", "Copy repository path")}</td>
                      <td>
                        <strong>${escapeHtml(binding.alias)}</strong>
                        ${
                          binding.missingIdentity
                            ? ""
                            : `<div class="muted truncate" title="${escapeHtml(`${binding.name} · ${binding.email}`)}">${escapeHtml(binding.name)} · ${escapeHtml(binding.email)}</div>`
                        }
                      </td>
                      <td>${binding.missingIdentity ? `<span class="badge warn">Identity missing</span>` : `<span class="badge good">Ready</span>`}</td>
                      <td>
                        <div class="actions">
                          ${iconButton({ action: "edit-binding", icon: "edit", label: `Change ${binding.alias} binding`, alias: binding.alias, path: binding.path })}
                          ${iconButton({ action: "remove-binding", icon: "trash", label: `Remove ${binding.alias} binding`, alias: binding.alias, path: binding.path, danger: true })}
                        </div>
                      </td>
                    </tr>
                  `,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function identityDetectionPanel(detection = currentDetection) {
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Identity Detection</h2>
                <p>Check which bgit identity applies to a repository or workspace path.</p>
              </div>
            </div>
            <form id="identityDetectionForm" class="detection-form">
              <label>
                Repository or workspace path
                <input name="path" value="${escapeHtml(selectedDetectPath)}" placeholder="/path/to/repo-or-workspace" required />
              </label>
              <button type="button" data-action="choose-detect-path"><span class="icon" aria-hidden="true">${iconSvg("folder")}</span>Choose Path</button>
              <button type="submit" class="primary"><span class="icon" aria-hidden="true">${iconSvg("search")}</span>Detect</button>
            </form>
            ${identityDetectionDetails(detection)}
          </section>
        `;
      }

      function identityDetectionDetails(detection) {
        if (!detection) {
          return `<p class="muted">Choose a path to see the effective identity and Git config state.</p>`;
        }
        if (!detection.alias) {
          return `
            <div class="warning-note">${escapeHtml(detection.message || "No identity detected for this path.")}</div>
          `;
        }
        const sourceLabel = detection.source === "binding"
          ? "Bound repository"
          : detection.source === "workspace"
            ? "Workspace"
            : "Global active identity";
        const matchBadge = detection.gitConfigChecked
          ? detection.gitMatches
            ? `<span class="badge good">Git config matches</span>`
            : `<span class="badge warn">Git config needs sync</span>`
          : `<span class="badge warn">Git config not checked</span>`;
        return `
          <div class="detection-grid">
            <div class="detection-item">
              <span>Detected Source</span>
              <strong>${escapeHtml(sourceLabel)}</strong>
              ${detection.sourcePath ? `<div class="muted">${escapeHtml(detection.sourcePath)}</div>` : ""}
            </div>
            <div class="detection-item">
              <span>Identity</span>
              <strong>${escapeHtml(detection.alias)}</strong>
              <div class="muted">${escapeHtml(detection.email)}</div>
            </div>
            <div class="detection-item">
              <span>Git Config</span>
              ${matchBadge}
              <div class="muted">${escapeHtml(detection.gitConfigScope || "unknown")}</div>
              ${
                detection.gitConfigChecked
                  ? `<div class="muted">${escapeHtml(detection.gitName)} &lt;${escapeHtml(detection.gitEmail)}&gt;</div>`
                  : ""
              }
            </div>
            <div class="detection-item">
              <span>Repository</span>
              ${copyableValue(detection.repoRoot || detection.path, "", "Copy detected path")}
            </div>
          </div>
          <div class="backup-actions" style="margin-top: 12px">
            <button
              type="button"
              data-action="sync-detected-identity"
              ${!detection.syncAvailable || detection.gitMatches ? "disabled" : ""}
            ><span class="icon" aria-hidden="true">${iconSvg("sync")}</span>Sync Identity</button>
            <span class="muted">${escapeHtml(detection.message || "")}</span>
          </div>
        `;
      }

      function doctorPanel(doctor) {
        if (!doctor) {
          return `
            <section class="panel">
              <div class="section-heading">
                <h2>Doctor</h2>
                <button type="button" data-action="doctor-refresh">Run Checks</button>
              </div>
              <p class="muted">Diagnostics not loaded.</p>
            </section>
          `;
        }

        const state =
          doctor.errors > 0
            ? "Needs attention"
            : doctor.warnings > 0
              ? "Warnings"
              : "Healthy";

        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Doctor</h2>
                <p>${escapeHtml(state)}</p>
              </div>
              <button type="button" data-action="doctor-refresh">Run Checks</button>
            </div>
            <div class="doctor-summary">
              <span class="badge good">${doctorSuccessCount(doctor)} passing</span>
              <span class="badge warn">${doctor.warnings || 0} warning(s)</span>
              <span class="badge ${doctor.errors > 0 ? "warn" : ""}">${doctor.errors || 0} error(s)</span>
            </div>
            ${doctorSections(doctor.sections || [])}
          </section>
        `;
      }

      function doctorSuccessCount(doctor) {
        return (doctor.sections || []).reduce(
          (total, section) =>
            total + (section.checks || []).filter((check) => check.level === "pass").length,
          0,
        );
      }

      function doctorSections(sections) {
        if (sections.length === 0) {
          return `<p class="muted">No diagnostics available.</p>`;
        }
        return `
          <div class="check-list">
            ${sections
              .map(
                (section) => `
                  <div class="check-section">
                    <h3>${escapeHtml(section.title)}</h3>
                    ${(section.checks || []).map(doctorCheckRow).join("")}
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function doctorCheckRow(check) {
        const level = check.level || "warn";
        return `
          <div class="check-row">
            <span class="check-level ${escapeHtml(level)}">${escapeHtml(doctorLevelLabels[level] || "Check")}</span>
            <div>
              <div>${escapeHtml(check.message)}</div>
              ${check.fix ? `<div class="check-fix">${escapeHtml(check.fix)}</div>` : ""}
            </div>
          </div>
        `;
      }

      function publicKeyBlock(identity) {
        if (identity.sshPublicKeyStatus === "available" && identity.sshPublicKey) {
          return `
            <div class="public-key-card">
              ${copyableValue(identity.sshPublicKey, "public-key-preview", `Copy public key for ${identity.alias}`)}
              <div class="key-actions">
                <span class="muted">Add this to GitHub SSH keys.</span>
              </div>
            </div>
          `;
        }
        if (identity.sshKeyStatus === "available") {
          return `
            <div class="public-key-card">
              <span class="badge warn">Public key missing</span>
              <span class="muted">Expected public key file next to the private key.</span>
            </div>
          `;
        }
        return `
          <div class="public-key-card">
            <span class="badge warn">Not configured</span>
            <span class="muted">Generate or set an SSH key to copy the GitHub public key.</span>
          </div>
        `;
      }

      function initials(identity) {
        const base = identity.name || identity.alias || identity.githubUsername || "?";
        return base
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0]?.toUpperCase() || "")
          .join("") || "?";
      }

      function avatarBlock(identity) {
        const fallback = escapeHtml(initials(identity));
        if (!identity.githubAvatarUrl) {
          return `<span class="avatar" aria-hidden="true">${fallback}</span>`;
        }
        return `
          <span class="avatar" aria-hidden="true">
            <img
              src="${escapeHtml(identity.githubAvatarUrl)}"
              alt=""
              loading="lazy"
              referrerpolicy="no-referrer"
              onerror="this.replaceWith(document.createTextNode('${fallback}'))"
            />
          </span>
        `;
      }

      function identityRows(identities) {
        if (identities.length === 0) {
          return `<div class="empty"><p>No identities configured.</p></div>`;
        }
        return `
          <table class="table">
            <thead>
              <tr>
                <th>Identity</th>
                <th>GitHub</th>
                <th>Public Key</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${identities
                .map(
                  (identity) => `
                    <tr class="${identity.active ? "active-row" : ""}">
                      <td>
                        <div class="identity-cell">
                          ${avatarBlock(identity)}
                          <div class="identity-details">
                            <strong class="truncate" title="${escapeHtml(identity.alias)}">${identity.active ? `<span class="active-dot" aria-hidden="true"></span>` : ""}${escapeHtml(identity.alias)}</strong>
                            <span class="truncate" title="${escapeHtml(identity.name)}">${escapeHtml(identity.name)}</span>
                            <span class="muted truncate" title="${escapeHtml(identity.email)}">${escapeHtml(identity.email)}</span>
                          </div>
                        </div>
                      </td>
                      <td><span class="truncate" title="${escapeHtml(identity.githubUsername)}">${escapeHtml(identity.githubUsername)}</span></td>
                      <td>${publicKeyBlock(identity)}</td>
                      <td>
                        <div class="actions">
                          ${identity.active ? `<span class="badge active">Active</span>` : ""}
                          ${statusBadge(identity.sshKeyStatus)}
                        </div>
                      </td>
                      <td>
                        <div class="actions">

      function identityCards(identities) {

        return `
          <div class="card-grid">
            ${identities
              .map(
                (identity) => `
                  <article class="identity-card ${identity.active ? "active" : ""}">
                    <div class="card-actions">
                      <div class="identity-cell">
                        ${avatarBlock(identity)}
                        <div class="identity-details">

                          <span class="truncate" title="${escapeHtml(identity.name)}">${escapeHtml(identity.name)}</span>
                          <span class="muted truncate" title="${escapeHtml(identity.email)}">${escapeHtml(identity.email)}</span>

                    <div class="muted truncate" title="${escapeHtml(identity.githubUsername)}">GitHub: ${escapeHtml(identity.githubUsername)}</div>
                    ${publicKeyBlock(identity)}

                      ${iconButton({ action: "edit", icon: "edit", label: `Edit ${identity.alias}`, alias: identity.alias })}
                      ${iconButton({ action: "delete", icon: "trash", label: `Delete ${identity.alias}`, alias: identity.alias, danger: true })}
                    </div>

      function dashboardPage(status, doctor) {
        const passCount = doctor ? doctorSuccessCount(doctor) : 0;

          ? doctor.errors > 0
            ? "Needs attention"
            : doctor.warnings > 0
              ? "Warnings"
              : "Healthy"
          : "Not checked";
        return `
          ${pageHeading("Dashboard", "A quick view of identity, repository, backup, and health status.")}
          <section class="panel summary">
            <div class="metric"><span>Identities</span><strong>${status.identityCount || 0}</strong></div>
            <div class="metric"><span>Repository Bindings</span><strong>${status.bindingCount || 0}</strong></div>
            <div class="metric"><span>Backup Status</span><strong>${lastExportPath || lastImportPath ? "Recent" : "Ready"}</strong></div>
            <div class="metric"><span>Doctor</span><strong>${escapeHtml(health)}</strong></div>
          </section>
          <div class="grid">
            ${activePanel(status)}
            <section class="panel active-card">
              <h2>Quick Actions</h2>
              <div class="actions">

              <div class="doctor-summary">
                <span class="badge good">${passCount} passing</span>
                <span class="badge warn">${doctor?.warnings || 0} warning(s)</span>

      function identitiesPage(status) {
        return `
          ${pageHeading("Identities", "Manage Git profiles and copy SSH public keys.", addIdentityButton())}
          ${identityCards(status.identities || [])}
        `;
      }

      function bindingsPage(status) {
        return `
          ${pageHeading("Repository Bindings", "Map local repositories to the identity they must use.")}
          ${repoBindingPanel(status)}
        `;

      function doctorPage(doctor) {
        return `
          ${pageHeading("Doctor", "Review configuration, SSH, and Git identity health.", `<button type="button" data-action="doctor-refresh"><span class="icon" aria-hidden="true">${iconSvg("shield")}</span>Run Checks</button>`)}

      function currentPageContent(status, doctor) {
        if (!status.configured) {
          return `
            ${pageHeading("Setup", "bgit is not configured on this machine.", addIdentityButton())}
            ${backupPage()}
            ${doctorPage(doctor)}
          `;
        }
        switch (currentPage) {
          case "identities":
            return identitiesPage(status);
          case "bindings":
            return bindingsPage(status);
          case "backup":
            return backupPage(status);
          case "doctor":
            return doctorPage(doctor);
          default:
            return dashboardPage(status, doctor);
        }
      }

      function render(status, doctor = currentDoctor) {
        const shell = document.getElementById("contentShell");
        const previousScrollY = shell ? shell.scrollTop : window.scrollY;
        currentStatus = status;
        currentDoctor = doctor;
        const target = document.getElementById("app");
        const hadRendered = target.dataset.rendered === "true";
        target.className = "";
        renderNavigation();
        renderTopbar(status, doctor);
        target.innerHTML = currentPageContent(status, doctor);
        bindForms();
        bindIdentityActions();
        bindIdentityDetectionActions();
        bindRepoBindingActions();
        bindBackupActions();
        bindCopyActions();
        bindDoctorActions();
        bindPageActions();
        finishRender(target, hadRendered, previousScrollY);
      }

      function finishRender(target, preserveScroll, previousScrollY) {
        target.dataset.rendered = "true";
        if (!preserveScroll) {
          return;
        }
        requestAnimationFrame(() => {
          const shell = document.getElementById("contentShell");
          if (shell) {
            shell.scrollTop = Math.min(previousScrollY, Math.max(0, shell.scrollHeight - shell.clientHeight));
            return;
          }
          const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
          window.scrollTo({ top: Math.min(previousScrollY, maxScroll), left: 0, behavior: "auto" });
        });
      }

        const data = new FormData(form);
        return {
          alias: String(data.get("alias") || "").trim(),
          name: String(data.get("name") || "").trim(),
          email: String(data.get("email") || "").trim(),
          githubUsername: String(data.get("githubUsername") || "").trim(),
          sshKeyPath: String(data.get("sshKeyPath") || "").trim(),
          generateSSHKey: data.get("generateSSHKey") === "on",

                    warning: "Only choose this if the key is not used anywhere else.",
                    acceptLabel: "Delete Keys",
                    cancelLabel: "Keep Keys",

          return;

        const previousDisabled = button.disabled;
        button.disabled = true;

            render(currentStatus, currentDoctor);
            await detectIdentityPath(path, document.getElementById("identityDetectionForm"));

      async function detectIdentityPath(path, disabledTarget) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return false;
        }
        setMessage("");
        setActionText("Detecting identity");
        const elements = disabledTarget
          ? Array.from(disabledTarget.querySelectorAll("button, input, select"))
          : [];
        const previousStates = elements.map((element) => ({ element, disabled: element.disabled }));
        elements.forEach((element) => {
          element.disabled = true;
        });
        try {
          currentDetection = await api().DetectIdentity({ path });
          render(currentStatus, currentDoctor);
          const tone = currentDetection.alias
            ? currentDetection.gitMatches
              ? "success"
              : "warn"
            : "warn";
          notify({
            title: "Identity detected",
            message: currentDetection.message || "Detection complete.",
            tone,
          });
          return true;
        } catch (error) {
          setMessage(actionableError(error), true, "Detection failed");
          return false;
        } finally {
          previousStates.forEach(({ element, disabled }) => {
            element.disabled = disabled;
          });
          setActionText("");
        }
      }

      async function syncDetectedIdentity(button) {
        if (!currentDetection?.path) {

          () => api().SyncDetectedIdentity({ path: currentDetection.path }),
          button,

          currentDetection = result.detected;
          if (result.status) {

      async function copyTextValue(value, button, message = "Copied to clipboard") {
        if (!value || value === "Default backup location" || value === "No archive selected") {
          setMessage("No value available to copy.", true, "Copy unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        const previousTitle = button.title;
        button.disabled = true;
        button.title = "Copied";
        button.classList.add("copied");
        try {
          if (window.runtime?.ClipboardSetText) {
            await window.runtime.ClipboardSetText(value);
          } else if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(value);
          } else {
            throw new Error("clipboard is not available");
          }
          notify({
            title: "Copied",
            message,
            tone: "success",
          });
        } catch (error) {
          setMessage(`Could not copy value: ${String(error)}`, true, "Copy failed");
        } finally {
          window.setTimeout(() => {
            button.disabled = previousDisabled;
            button.title = previousTitle || "Copy";
            button.classList.remove("copied");
          }, 900);
        }
      }

      function confirmAction({ title, message, warning = "", acceptLabel = "Continue", cancelLabel = "Cancel", danger = false }) {
        const dialog = document.getElementById("confirmDialog");
        const form = document.getElementById("confirmForm");
        const accept = document.getElementById("confirmAccept");
        const cancel = document.getElementById("confirmCancel");
        const warningBox = document.getElementById("confirmWarning");

        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMessage").textContent = message;
        warningBox.textContent = warning;
        warningBox.hidden = !warning;
        accept.textContent = acceptLabel;
        accept.classList.toggle("danger", danger);
        cancel.textContent = cancelLabel;

        return new Promise((resolve) => {
          let settled = false;
          const finish = (value) => {
            if (settled) {
              return;
            }
            settled = true;
            form.removeEventListener("submit", onSubmit);
            cancel.removeEventListener("click", onCancel);
            dialog.removeEventListener("close", onClose);
            if (dialog.open) {
              dialog.close();
            }
            resolve(value);
          };
          const onSubmit = (event) => {
            event.preventDefault();
            finish(true);
          };
          const onCancel = () => finish(false);
          const onClose = () => finish(false);

          form.addEventListener("submit", onSubmit);
          cancel.addEventListener("click", onCancel);
          dialog.addEventListener("close", onClose);
          dialog.showModal();
        });
      }

      async function runAction(action, disabledTarget, actionText = "Working") {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return false;
        }
        setMessage("");
        setActionText(actionText);
        const disabledElements =
          disabledTarget.tagName === "FORM"
            ? Array.from(disabledTarget.querySelectorAll("button, input"))
            : [disabledTarget];
        const previousStates = disabledElements.map((element) => ({
          element,
          disabled: element.disabled,
          label: element.tagName === "BUTTON" ? element.textContent : "",
        }));
        disabledElements.forEach((element) => {
          element.disabled = true;
        });
        if (disabledTarget.tagName === "BUTTON") {
          disabledTarget.textContent = "Working...";
        }
        try {
          const result = await action();
          const doctor = await api().GetDoctorStatus();
          if (result?.status) {
            render(result.status, doctor);
          } else {
            await load();
          }
          setMessage(result?.message || "Done", false, "Action complete");
          return result || true;
        } catch (error) {
          setMessage(actionableError(error), true, "Action failed");
          return false;
        } finally {
          previousStates.forEach(({ element, disabled, label }) => {
            element.disabled = disabled;
            if (element.tagName === "BUTTON") {
              element.textContent = label;
            }
          });
          setActionText("");
        }
      }

      async function runDoctorRefresh(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = "Checking...";
        setActionText("Running diagnostics");
        try {
          const doctor = await api().GetDoctorStatus();
          render(currentStatus, doctor);
          const tone = doctor.errors > 0 ? "error" : doctor.warnings > 0 ? "warn" : "success";
          notify({
            title: "Doctor checks refreshed",
            message:
              doctor.errors > 0
                ? `${doctor.errors} issue(s) need attention. Review the fix hints below.`
                : doctor.warnings > 0
                  ? `${doctor.warnings} warning(s) found. Review the diagnostics below.`
                  : "All visible checks are healthy.",
            tone,
          });
        } catch (error) {
          setMessage(actionableError(error), true, "Doctor failed");
        } finally {
          button.disabled = previousDisabled;
          button.textContent = previousLabel;
          setActionText("");
        }
      }

      function actionableError(error) {
        const message = String(error);
        if (message.includes("not configured")) {
          return `${message} Add your first identity or run bgit setup from the CLI.`;
        }
        if (message.includes("SSH")) {
          return `${message} Check the SSH key path or run Doctor for details.`;
        }
        if (message.includes("git config") || message.includes("identity")) {
          return `${message} Use bgit sync --fix or activate the expected identity.`;
        }
        return message;
      }

      async function load() {
        const target = document.getElementById("app");
        try {
          target.className = "panel";
          target.textContent = "Loading...";
          if (!api()) {
            throw new Error("Desktop backend is not available. Open this screen in the Wails app window.");
          }
          const [status, doctor] = await Promise.all([api().GetStatus(), api().GetDoctorStatus()]);
          render(status, doctor);
        } catch (error) {
          target.textContent = String(error);
          notify({
            title: "Desktop unavailable",
            message: actionableError(error),
            tone: "error",
            timeout: 0,
          });
        }
      }

      document.getElementById("cancelEdit").addEventListener("click", () => {
        document.getElementById("editDialog").close();
      });
      document.getElementById("cancelAdd").addEventListener("click", () => {
        document.getElementById("addDialog").close();
      });
      document.getElementById("editForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = formPayload(form);
        payload.generateSSHKey = false;
        const saved = await runAction(() => api().UpdateIdentity(payload), form, `Saving ${payload.alias}`);
        if (saved) {
          document.getElementById("editDialog").close();
        }
      });

      load();
    </script>
  </body>
</html>
