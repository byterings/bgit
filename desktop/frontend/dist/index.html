<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bgit</title>
    <style>
      :root {
        color: #172033;
        background: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px;
      }
      header,
      .section-heading,
      .row-actions {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 16px;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      p {
        margin: 0;
        color: #526071;
      }
      button,
      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        color: #172033;
        min-height: 36px;
        font: inherit;
      }
      button {
        padding: 0 14px;
        cursor: pointer;
      }
      button:hover {
        border-color: #94a3b8;
        background: #f8fafc;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      button.primary {
        border-color: #172033;
        color: #ffffff;
        background: #172033;
      }
      button.primary:hover {
        border-color: #334155;
        background: #334155;
      }
      input {
        width: 100%;
        padding: 0 10px;
      }
      select {
        width: 100%;
        padding: 0 10px;
      }
      label {
        display: grid;
        gap: 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
      }
      input[type="checkbox"] {
        width: 16px;
        min-height: 16px;
      }
      .panel {
        margin-top: 24px;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #ffffff;
        padding: 20px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .doctor-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .metric {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
      }
      .metric strong {
        display: block;
        font-size: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .form-grid .wide {
        grid-column: 1 / -1;
      }
      .backup-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .backup-box {
        display: grid;
        gap: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 14px;
      }
      .backup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .backup-path,
      .backup-summary,
      .repo-path {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        padding: 10px;
        color: #475569;
        overflow-wrap: anywhere;
      }
      .warning-note {
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        padding: 10px;
        line-height: 1.4;
      }
      .active-card,
      .stack {
        display: grid;
        gap: 10px;
      }
      .active-name {
        font-size: 22px;
        font-weight: 700;
      }
      .muted {
        color: #64748b;
      }
      .message {
        margin-top: 16px;
        min-height: 20px;
        color: #166534;
      }
      .message.error {
        color: #b91c1c;
      }
      .toast-region {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 20;
        display: grid;
        width: min(420px, calc(100vw - 32px));
        gap: 10px;
      }
      .toast {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgb(15 23 42 / 0.12);
        padding: 12px;
      }
      .toast::before {
        content: "";
        width: 8px;
        height: 100%;
        min-height: 44px;
        border-radius: 999px;
        background: #16a34a;
      }
      .toast.warn::before {
        background: #d97706;
      }
      .toast.error::before {
        background: #dc2626;
      }
      .toast-title {
        margin-bottom: 4px;
        font-weight: 700;
      }
      .toast-message {
        color: #526071;
        line-height: 1.4;
      }
      .toast-close {
        min-width: 28px;
        min-height: 28px;
        padding: 0;
      }
      .action-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        color: #475569;
        font-size: 13px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e1;
        border-top-color: #172033;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .badge {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        padding: 0 10px;
        font-size: 12px;
        color: #334155;
        background: #f8fafc;
      }
      .badge.good {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .badge.warn {
        border-color: #fde68a;
        color: #92400e;
        background: #fffbeb;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th,
      .table td {
        border-top: 1px solid #eef2f7;
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }
      .table th {
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      .table tr:first-child th {
        border-top: 0;
      }
      .identity-cell {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .identity-details {
        display: grid;
        gap: 4px;
        min-width: 0;
      }
      .avatar {
        display: inline-grid;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        place-items: center;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #f8fafc;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
        overflow: hidden;
      }
      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .path {
        display: block;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .public-key-card {
        display: grid;
        gap: 8px;
        max-width: 420px;
      }
      .public-key-preview {
        display: block;
        max-width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        padding: 8px;
        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .key-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .binding-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 240px) auto auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 16px;
      }
      .detection-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 16px;
      }
      .detection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .detection-item {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
      }
      .detection-item span {
        display: block;
        margin-bottom: 4px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      .check-list {
        display: grid;
        gap: 14px;
      }
      .check-section {
        display: grid;
        gap: 8px;
      }
      .check-section h3 {
        margin: 0;
      }
      .check-row {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        border-top: 1px solid #eef2f7;
        padding-top: 8px;
      }
      .check-level {
        display: inline-flex;
        width: fit-content;
        min-height: 24px;
        align-items: center;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 600;
      }
      .check-level.pass {
        border-color: #86efac;
        color: #166534;
        background: #f0fdf4;
      }
      .check-level.warn {
        border-color: #fde68a;
        color: #92400e;
        background: #fffbeb;
      }
      .check-level.fail {
        border-color: #fecaca;
        color: #991b1b;
        background: #fef2f2;
      }
      .check-fix {
        margin-top: 4px;
        color: #64748b;
      }
      .danger {
        border-color: #fecaca;
        color: #991b1b;
      }
      code {
        color: #334155;
      }
      .empty {
        min-height: 180px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      dialog {
        width: min(640px, calc(100vw - 32px));
        border: 1px solid #d8dee8;
        border-radius: 8px;
        padding: 0;
      }
      dialog::backdrop {
        background: rgb(15 23 42 / 0.28);
      }
      .dialog-body {
        padding: 20px;
      }
      .dialog-copy {
        margin: 10px 0 0;
        line-height: 1.5;
      }
      .dialog-warning {
        margin-top: 14px;
        border: 1px solid #fde68a;
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        padding: 10px 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }
      @media (max-width: 820px) {
        main {
          padding: 20px;
        }
        header,
        .section-heading,
        .row-actions {
          display: grid;
        }
        .grid,
        .form-grid,
        .backup-grid,
        .binding-form,
        .detection-form {
          grid-template-columns: 1fr;
        }
        .table {
          display: block;
          overflow-x: auto;
        }
        .toast-region {
          right: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>bgit</h1>
          <p>Identity dashboard for this machine.</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <section id="app" class="panel">Loading...</section>
      <p id="message" class="message" aria-live="polite"></p>
    </main>
    <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="false"></div>

    <dialog id="editDialog">
      <form id="editForm" class="dialog-body" method="dialog">
        <h2>Edit Identity</h2>
        <input id="editAlias" name="alias" type="hidden" />
        <div class="form-grid">
          <label>
            Name
            <input id="editName" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input id="editEmail" name="email" autocomplete="email" required />
          </label>
          <label>
            GitHub username
            <input id="editGitHub" name="githubUsername" required />
          </label>
          <label>
            SSH private key path
            <input id="editSSHKey" name="sshKeyPath" />
          </label>
        </div>
        <div class="row-actions" style="margin-top: 18px">
          <button id="cancelEdit" type="button">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmDialog">
      <form id="confirmForm" class="dialog-body" method="dialog">
        <h2 id="confirmTitle">Confirm Action</h2>
        <p id="confirmMessage" class="dialog-copy"></p>
        <div id="confirmWarning" class="dialog-warning" hidden></div>
        <div class="dialog-actions">
          <button id="confirmCancel" type="button">Cancel</button>
          <button id="confirmAccept" class="primary" type="submit">Continue</button>
        </div>
      </form>
    </dialog>

    <script>
      const statusLabels = {
        available: "Available",
        missing: "Missing",
        not_configured: "Not configured",
        unknown: "Unknown",
      };
      const doctorLevelLabels = {
        pass: "Pass",
        warn: "Warn",
        fail: "Fail",
      };
      let currentStatus = null;
      let currentDoctor = null;
      let activeActionText = "";
      let toastCounter = 0;
      let lastExportPath = "";
      let lastImportPath = "";
      let selectedRepoPath = "";
      let selectedDetectPath = "";
      let currentDetection = null;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function api() {
        return window.go?.main?.App;
      }

      function setMessage(text, error = false, title = "") {
        const target = document.getElementById("message");
        target.textContent = text || "";
        target.classList.toggle("error", error);
        if (text) {
          notify({
            title: title || (error ? "Action failed" : "Done"),
            message: text,
            tone: error ? "error" : "success",
          });
        }
      }

      function notify({ title, message, tone = "success", timeout = 5200 }) {
        const region = document.getElementById("toasts");
        const id = `toast-${++toastCounter}`;
        const toast = document.createElement("div");
        toast.id = id;
        toast.className = `toast ${tone}`;
        toast.innerHTML = `
          <div>
            <div class="toast-title">${escapeHtml(title)}</div>
            <div class="toast-message">${escapeHtml(message)}</div>
          </div>
          <button class="toast-close" type="button" aria-label="Dismiss notification">×</button>
        `;
        region.appendChild(toast);
        const remove = () => toast.remove();
        toast.querySelector("button").addEventListener("click", remove);
        if (timeout > 0) {
          window.setTimeout(remove, timeout);
        }
      }

      function setActionText(text) {
        activeActionText = text || "";
        const note = document.getElementById("actionNote");
        if (note) {
          note.innerHTML = activeActionText
            ? `<span class="spinner" aria-hidden="true"></span>${escapeHtml(activeActionText)}`
            : "";
        }
      }

      function statusBadge(status) {
        const label = statusLabels[status] || "Unknown";
        const tone = status === "available" ? "good" : status === "missing" ? "warn" : "";
        return `<span class="badge ${tone}">${label}</span>`;
      }

      function activePanel(status) {
        const active = status.activeIdentity;
        if (!active) {
          return `
            <section class="panel active-card">
              <h2>Active Profile</h2>
              <p class="muted">No active identity set.</p>
            </section>
          `;
        }
        const effective = status.effectiveIdentity;
        return `
          <section class="panel active-card">
            <h2>Active Profile</h2>
            <div class="active-name">${escapeHtml(active.alias)}</div>
            <div>${escapeHtml(active.name)}</div>
            <div class="muted">${escapeHtml(active.email)}</div>
            <div class="muted">GitHub: ${escapeHtml(active.githubUsername)}</div>
            ${statusBadge(active.sshKeyStatus)}
            ${
              effective
                ? `<div class="muted">Effective source: ${escapeHtml(effective.source)}</div>`
                : ""
            }
          </section>
        `;
      }

      function addIdentityForm() {
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Add Identity</h2>
              </div>
            </div>
            <form id="addForm" class="form-grid">
              <label>
                Alias
                <input name="alias" autocomplete="off" required />
              </label>
              <label>
                GitHub username
                <input name="githubUsername" autocomplete="username" required />
              </label>
              <label>
                Name
                <input name="name" autocomplete="name" required />
              </label>
              <label>
                Email
                <input name="email" autocomplete="email" required />
              </label>
              <label class="wide">
                Existing SSH private key path
                <input name="sshKeyPath" placeholder="Optional" />
              </label>
              <label class="check wide">
                <input name="generateSSHKey" type="checkbox" />
                Generate new SSH key
              </label>
              <div class="wide">
                <button type="submit">Add Identity</button>
                <span id="actionNote" class="action-note">${activeActionText ? `<span class="spinner" aria-hidden="true"></span>${escapeHtml(activeActionText)}` : ""}</span>
              </div>
            </form>
          </section>
        `;
      }

      function backupPanel() {
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Backup & Restore</h2>
              </div>
            </div>
            <div class="backup-grid">
              <form id="exportForm" class="backup-box">
                <h3>Export Backup</h3>
                <div class="warning-note">Keep this password safe. It is required for import and cannot be recovered.</div>
                <label>
                  Export password
                  <input name="password" type="password" autocomplete="new-password" required />
                </label>
                <label>
                  Confirm password
                  <input name="confirmPassword" type="password" autocomplete="new-password" required />
                </label>
                <input name="outputPath" type="hidden" value="${escapeHtml(lastExportPath)}" />
                <div class="backup-path">${escapeHtml(lastExportPath || "Default backup location")}</div>
                <div class="backup-actions">
                  <button type="button" data-action="choose-export">Choose Location</button>
                  <button type="submit">Export</button>
                </div>
              </form>

              <form id="importForm" class="backup-box">
                <h3>Import Backup</h3>
                <div class="warning-note">Import replaces the current bgit configuration with the selected archive contents.</div>
                <input name="archivePath" type="hidden" value="${escapeHtml(lastImportPath)}" required />
                <div class="backup-path">${escapeHtml(lastImportPath || "No archive selected")}</div>
                <label>
                  Import password
                  <input name="password" type="password" autocomplete="current-password" required />
                </label>
                <div class="backup-actions">
                  <button type="button" data-action="choose-import">Choose Archive</button>
                  <button type="submit">Import</button>
                </div>
                <div id="importSummary" class="backup-summary" hidden></div>
              </form>
            </div>
          </section>
        `;
      }

      function repoBindingPanel(status) {
        const identities = status.identities || [];
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Repository Bindings</h2>
                <p>Pin local Git repositories to the identity they must use.</p>
              </div>
            </div>
            <form id="repoBindingForm" class="binding-form">
              <label>
                Repository path
                <input name="path" value="${escapeHtml(selectedRepoPath)}" placeholder="/path/to/git/repo" required />
              </label>
              <label>
                Identity
                <select name="alias" required ${identities.length === 0 ? "disabled" : ""}>
                  <option value="">Select identity</option>
                  ${identities
                    .map(
                      (identity) =>
                        `<option value="${escapeHtml(identity.alias)}">${escapeHtml(identity.alias)}</option>`,
                    )
                    .join("")}
                </select>
              </label>
              <button type="button" data-action="choose-repo">Choose Repo</button>
              <button type="submit" class="primary" ${identities.length === 0 ? "disabled" : ""}>Bind</button>
            </form>
            ${repoBindingRows(status.bindings || [])}
          </section>
        `;
      }

      function repoBindingRows(bindings) {
        if (bindings.length === 0) {
          return `<div class="empty"><p>No repository bindings configured.</p></div>`;
        }
        return `
          <table class="table">
            <thead>
              <tr>
                <th>Repository</th>
                <th>Identity</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${bindings
                .map(
                  (binding) => `
                    <tr>
                      <td><code class="repo-path">${escapeHtml(binding.path)}</code></td>
                      <td>
                        <strong>${escapeHtml(binding.alias)}</strong>
                        ${
                          binding.missingIdentity
                            ? ""
                            : `<div class="muted">${escapeHtml(binding.name)} · ${escapeHtml(binding.email)}</div>`
                        }
                      </td>
                      <td>${binding.missingIdentity ? `<span class="badge warn">Identity missing</span>` : `<span class="badge good">Ready</span>`}</td>
                      <td>
                        <div class="actions">
                          <button type="button" data-action="edit-binding" data-path="${escapeHtml(binding.path)}" data-alias="${escapeHtml(binding.alias)}">Change</button>
                          <button class="danger" type="button" data-action="remove-binding" data-path="${escapeHtml(binding.path)}" data-alias="${escapeHtml(binding.alias)}">Remove</button>
                        </div>
                      </td>
                    </tr>
                  `,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function identityDetectionPanel(detection = currentDetection) {
        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Identity Detection</h2>
                <p>Check which bgit identity applies to a repository or workspace path.</p>
              </div>
            </div>
            <form id="identityDetectionForm" class="detection-form">
              <label>
                Repository or workspace path
                <input name="path" value="${escapeHtml(selectedDetectPath)}" placeholder="/path/to/repo-or-workspace" required />
              </label>
              <button type="button" data-action="choose-detect-path">Choose Path</button>
              <button type="submit" class="primary">Detect</button>
            </form>
            ${identityDetectionDetails(detection)}
          </section>
        `;
      }

      function identityDetectionDetails(detection) {
        if (!detection) {
          return `<p class="muted">Choose a path to see the effective identity and Git config state.</p>`;
        }
        if (!detection.alias) {
          return `
            <div class="warning-note">${escapeHtml(detection.message || "No identity detected for this path.")}</div>
          `;
        }
        const sourceLabel = detection.source === "binding"
          ? "Bound repository"
          : detection.source === "workspace"
            ? "Workspace"
            : "Global active identity";
        const matchBadge = detection.gitConfigChecked
          ? detection.gitMatches
            ? `<span class="badge good">Git config matches</span>`
            : `<span class="badge warn">Git config needs sync</span>`
          : `<span class="badge warn">Git config not checked</span>`;
        return `
          <div class="detection-grid">
            <div class="detection-item">
              <span>Detected Source</span>
              <strong>${escapeHtml(sourceLabel)}</strong>
              ${detection.sourcePath ? `<div class="muted">${escapeHtml(detection.sourcePath)}</div>` : ""}
            </div>
            <div class="detection-item">
              <span>Identity</span>
              <strong>${escapeHtml(detection.alias)}</strong>
              <div class="muted">${escapeHtml(detection.email)}</div>
            </div>
            <div class="detection-item">
              <span>Git Config</span>
              ${matchBadge}
              <div class="muted">${escapeHtml(detection.gitConfigScope || "unknown")}</div>
              ${
                detection.gitConfigChecked
                  ? `<div class="muted">${escapeHtml(detection.gitName)} &lt;${escapeHtml(detection.gitEmail)}&gt;</div>`
                  : ""
              }
            </div>
            <div class="detection-item">
              <span>Repository</span>
              <code>${escapeHtml(detection.repoRoot || detection.path)}</code>
            </div>
          </div>
          <div class="backup-actions" style="margin-top: 12px">
            <button
              type="button"
              data-action="sync-detected-identity"
              ${!detection.syncAvailable || detection.gitMatches ? "disabled" : ""}
            >Sync Identity</button>
            <span class="muted">${escapeHtml(detection.message || "")}</span>
          </div>
        `;
      }

      function doctorPanel(doctor) {
        if (!doctor) {
          return `
            <section class="panel">
              <div class="section-heading">
                <h2>Doctor</h2>
                <button type="button" data-action="doctor-refresh">Run Checks</button>
              </div>
              <p class="muted">Diagnostics not loaded.</p>
            </section>
          `;
        }

        const state =
          doctor.errors > 0
            ? "Needs attention"
            : doctor.warnings > 0
              ? "Warnings"
              : "Healthy";

        return `
          <section class="panel">
            <div class="section-heading">
              <div>
                <h2>Doctor</h2>
                <p>${escapeHtml(state)}</p>
              </div>
              <button type="button" data-action="doctor-refresh">Run Checks</button>
            </div>
            <div class="doctor-summary">
              <span class="badge good">${doctorSuccessCount(doctor)} passing</span>
              <span class="badge warn">${doctor.warnings || 0} warning(s)</span>
              <span class="badge ${doctor.errors > 0 ? "warn" : ""}">${doctor.errors || 0} error(s)</span>
            </div>
            ${doctorSections(doctor.sections || [])}
          </section>
        `;
      }

      function doctorSuccessCount(doctor) {
        return (doctor.sections || []).reduce(
          (total, section) =>
            total + (section.checks || []).filter((check) => check.level === "pass").length,
          0,
        );
      }

      function doctorSections(sections) {
        if (sections.length === 0) {
          return `<p class="muted">No diagnostics available.</p>`;
        }
        return `
          <div class="check-list">
            ${sections
              .map(
                (section) => `
                  <div class="check-section">
                    <h3>${escapeHtml(section.title)}</h3>
                    ${(section.checks || []).map(doctorCheckRow).join("")}
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function doctorCheckRow(check) {
        const level = check.level || "warn";
        return `
          <div class="check-row">
            <span class="check-level ${escapeHtml(level)}">${escapeHtml(doctorLevelLabels[level] || "Check")}</span>
            <div>
              <div>${escapeHtml(check.message)}</div>
              ${check.fix ? `<div class="check-fix">${escapeHtml(check.fix)}</div>` : ""}
            </div>
          </div>
        `;
      }

      function publicKeyBlock(identity) {
        if (identity.sshPublicKeyStatus === "available" && identity.sshPublicKey) {
          return `
            <div class="public-key-card">
              <code class="public-key-preview" title="${escapeHtml(identity.sshPublicKey)}">${escapeHtml(identity.sshPublicKey)}</code>
              <div class="key-actions">
                <button type="button" data-action="copy-public-key" data-alias="${escapeHtml(identity.alias)}">Copy Public Key</button>
                <span class="muted">Add this to GitHub SSH keys.</span>
              </div>
            </div>
          `;
        }
        if (identity.sshKeyStatus === "available") {
          return `
            <div class="public-key-card">
              <span class="badge warn">Public key missing</span>
              <span class="muted">Expected public key file next to the private key.</span>
            </div>
          `;
        }
        return `
          <div class="public-key-card">
            <span class="badge warn">Not configured</span>
            <span class="muted">Generate or set an SSH key to copy the GitHub public key.</span>
          </div>
        `;
      }

      function initials(identity) {
        const base = identity.name || identity.alias || identity.githubUsername || "?";
        return base
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0]?.toUpperCase() || "")
          .join("") || "?";
      }

      function avatarBlock(identity) {
        const fallback = escapeHtml(initials(identity));
        if (!identity.githubAvatarUrl) {
          return `<span class="avatar" aria-hidden="true">${fallback}</span>`;
        }
        return `
          <span class="avatar" aria-hidden="true">
            <img
              src="${escapeHtml(identity.githubAvatarUrl)}"
              alt=""
              loading="lazy"
              referrerpolicy="no-referrer"
              onerror="this.replaceWith(document.createTextNode('${fallback}'))"
            />
          </span>
        `;
      }

      function identityRows(identities) {
        if (identities.length === 0) {
          return `<div class="empty"><p>No identities configured.</p></div>`;
        }
        return `
          <table class="table">
            <thead>
              <tr>
                <th>Identity</th>
                <th>GitHub</th>
                <th>Public Key</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${identities
                .map(
                  (identity) => `
                    <tr>
                      <td>
                        <div class="identity-cell">
                          ${avatarBlock(identity)}
                          <div class="identity-details">
                            <strong>${escapeHtml(identity.alias)}${identity.active ? " (active)" : ""}</strong>
                            <span>${escapeHtml(identity.name)}</span>
                            <span class="muted">${escapeHtml(identity.email)}</span>
                          </div>
                        </div>
                      </td>
                      <td>${escapeHtml(identity.githubUsername)}</td>
                      <td>${publicKeyBlock(identity)}</td>
                      <td>${statusBadge(identity.sshKeyStatus)}</td>
                      <td>
                        <div class="actions">
                          <button type="button" data-action="activate" data-alias="${escapeHtml(identity.alias)}" ${identity.active ? "disabled" : ""}>Use</button>
                          <button type="button" data-action="edit" data-alias="${escapeHtml(identity.alias)}">Edit</button>
                          <button class="danger" type="button" data-action="delete" data-alias="${escapeHtml(identity.alias)}">Delete</button>
                        </div>
                      </td>
                    </tr>
                  `,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function render(status, doctor = currentDoctor) {
        currentStatus = status;
        currentDoctor = doctor;
        const target = document.getElementById("app");
        target.className = "";

        if (!status.configured) {
          target.innerHTML = `
            <section class="panel empty"><p>bgit is not configured on this machine.</p></section>
            ${addIdentityForm()}
            ${backupPanel()}
            ${repoBindingPanel(status)}
            ${doctorPanel(doctor)}
          `;
          bindForms();
          bindBackupActions();
          bindRepoBindingActions();
          bindDoctorActions();
          return;
        }

        const identities = status.identities || [];
        target.innerHTML = `
          <section class="panel summary">
            <div class="metric"><span>Identities</span><strong>${status.identityCount}</strong></div>
            <div class="metric"><span>Workspaces</span><strong>${status.workspaceCount}</strong></div>
            <div class="metric"><span>Bindings</span><strong>${status.bindingCount}</strong></div>
            <div class="metric"><span>Setup</span><strong>${status.setupCompleted ? "Ready" : "Pending"}</strong></div>
          </section>
          <div class="grid">
            ${activePanel(status)}
            ${addIdentityForm()}
          </div>
          ${identityDetectionPanel()}
          <section class="panel">
            <h2>Identities</h2>
            ${identityRows(identities)}
          </section>
          ${repoBindingPanel(status)}
          ${backupPanel()}
          ${doctorPanel(doctor)}
        `;
        bindForms();
        bindIdentityActions();
        bindIdentityDetectionActions();
        bindRepoBindingActions();
        bindBackupActions();
        bindDoctorActions();
      }

      function formPayload(form) {
        const data = new FormData(form);
        return {
          alias: String(data.get("alias") || "").trim(),
          name: String(data.get("name") || "").trim(),
          email: String(data.get("email") || "").trim(),
          githubUsername: String(data.get("githubUsername") || "").trim(),
          sshKeyPath: String(data.get("sshKeyPath") || "").trim(),
          generateSSHKey: data.get("generateSSHKey") === "on",
        };
      }

      function bindForms() {
        const addForm = document.getElementById("addForm");
        if (!addForm) {
          return;
        }
        addForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          await runAction(() => api().AddIdentity(formPayload(addForm)), addForm, "Adding identity");
        });
      }

      function bindIdentityActions() {
        document.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", async () => {
            const alias = button.dataset.alias;
            if (button.dataset.action === "activate") {
              await runAction(() => api().ActivateIdentity(alias), button, `Activating ${alias}`);
            }
            if (button.dataset.action === "edit") {
              openEditDialog(alias);
            }
            if (button.dataset.action === "delete") {
              const identity = findIdentity(alias);
              const confirmed = await confirmAction({
                title: "Delete Identity",
                message: `Delete identity '${alias}' from bgit? This removes the profile from bgit configuration.`,
                warning: identity?.sshKeyPath
                  ? "SSH key files will be kept unless you choose to delete them in the next step."
                  : "",
                acceptLabel: "Delete",
                danger: true,
              });
              if (!confirmed) {
                return;
              }
              const deleteKeys = identity?.sshKeyPath
                ? await confirmAction({
                    title: "Delete SSH Keys",
                    message: `Also delete SSH key files for '${alias}'?`,
                    warning: "Only choose this if the key is not used anywhere else.",
                    acceptLabel: "Delete Keys",
                    cancelLabel: "Keep Keys",
                    danger: true,
                  })
                : false;
              await runAction(() => api().DeleteIdentity({ alias, deleteKeys }), button, `Deleting ${alias}`);
            }
            if (button.dataset.action === "copy-public-key") {
              await copyPublicKey(alias, button);
            }
          });
        });
      }

      function bindDoctorActions() {
        document.querySelectorAll("[data-action='doctor-refresh']").forEach((button) => {
          button.addEventListener("click", async () => {
            await runDoctorRefresh(button);
          });
        });
      }

      function bindBackupActions() {
        const exportForm = document.getElementById("exportForm");
        if (exportForm) {
          exportForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = new FormData(exportForm);
            const exported = await runBackupAction(
              () =>
                api().ExportBackup({
                  password: String(data.get("password") || ""),
                  confirmPassword: String(data.get("confirmPassword") || ""),
                  outputPath: String(data.get("outputPath") || ""),
                }),
              exportForm,
              "Creating encrypted backup",
            );
            if (exported?.archivePath) {
              lastExportPath = exported.archivePath;
              exportForm.reset();
              render(exported.status || currentStatus, exported.doctor || currentDoctor);
              notify({
                title: "Backup created",
                message: exported.archivePath,
                tone: "success",
                timeout: 0,
              });
            }
          });
        }

        const importForm = document.getElementById("importForm");
        if (importForm) {
          importForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = new FormData(importForm);
            const archivePath = String(data.get("archivePath") || "");
            if (!archivePath) {
              setMessage("Choose a .bgit archive before importing.", true, "Archive required");
              return;
            }
            const confirmed = await confirmAction({
              title: "Import Backup",
              message: "Replace the current bgit configuration with this encrypted backup?",
              warning: "Current identities, bindings, workspaces, and managed SSH config will be replaced by the archive contents.",
              acceptLabel: "Import",
              danger: true,
            });
            if (!confirmed) {
              return;
            }
            const imported = await runBackupAction(
              () =>
                api().ImportBackup({
                  password: String(data.get("password") || ""),
                  archivePath,
                }),
              importForm,
              "Importing backup",
            );
            if (imported) {
              lastImportPath = archivePath;
              render(imported.status || currentStatus, imported.doctor || currentDoctor);
              showImportSummary(imported);
            }
          });
        }

        document.querySelectorAll("[data-action='choose-export']").forEach((button) => {
          button.addEventListener("click", async () => {
            await chooseExportPath(button);
          });
        });
        document.querySelectorAll("[data-action='choose-import']").forEach((button) => {
          button.addEventListener("click", async () => {
            await chooseImportPath(button);
          });
        });
      }

      function bindIdentityDetectionActions() {
        const form = document.getElementById("identityDetectionForm");
        if (form) {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const path = String(new FormData(form).get("path") || "").trim();
            selectedDetectPath = path;
            await detectIdentityPath(path, form);
          });
        }

        document.querySelectorAll("[data-action='choose-detect-path']").forEach((button) => {
          button.addEventListener("click", async () => {
            await chooseIdentityPath(button);
          });
        });

        document.querySelectorAll("[data-action='sync-detected-identity']").forEach((button) => {
          button.addEventListener("click", async () => {
            await syncDetectedIdentity(button);
          });
        });
      }

      async function chooseIdentityPath(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        button.disabled = true;
        try {
          const path = await api().ChooseIdentityPath();
          if (path) {
            selectedDetectPath = path;
            render(currentStatus, currentDoctor);
            await detectIdentityPath(path, document.getElementById("identityDetectionForm"));
          }
        } catch (error) {
          setMessage(actionableError(error), true, "Choose path failed");
        } finally {
          button.disabled = previousDisabled;
        }
      }

      async function detectIdentityPath(path, disabledTarget) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return false;
        }
        setMessage("");
        setActionText("Detecting identity");
        const elements = disabledTarget
          ? Array.from(disabledTarget.querySelectorAll("button, input, select"))
          : [];
        const previousStates = elements.map((element) => ({ element, disabled: element.disabled }));
        elements.forEach((element) => {
          element.disabled = true;
        });
        try {
          currentDetection = await api().DetectIdentity({ path });
          render(currentStatus, currentDoctor);
          const tone = currentDetection.alias
            ? currentDetection.gitMatches
              ? "success"
              : "warn"
            : "warn";
          notify({
            title: "Identity detected",
            message: currentDetection.message || "Detection complete.",
            tone,
          });
          return true;
        } catch (error) {
          setMessage(actionableError(error), true, "Detection failed");
          return false;
        } finally {
          previousStates.forEach(({ element, disabled }) => {
            element.disabled = disabled;
          });
          setActionText("");
        }
      }

      async function syncDetectedIdentity(button) {
        if (!currentDetection?.path) {
          setMessage("Detect an identity before syncing.", true, "Detection required");
          return;
        }
        const result = await runAction(
          () => api().SyncDetectedIdentity({ path: currentDetection.path }),
          button,
          "Syncing detected identity",
        );
        if (result?.detected) {
          currentDetection = result.detected;
          if (result.status) {
            render(result.status, currentDoctor);
          } else {
            render(currentStatus, currentDoctor);
          }
        }
      }

      function bindRepoBindingActions() {
        const form = document.getElementById("repoBindingForm");
        if (form) {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = repoBindingPayload(form);
            selectedRepoPath = payload.path;
            await runAction(() => api().BindRepository(payload), form, "Binding repository");
          });
        }

        document.querySelectorAll("[data-action='choose-repo']").forEach((button) => {
          button.addEventListener("click", async () => {
            await chooseRepositoryPath(button);
          });
        });

        document.querySelectorAll("[data-action='edit-binding']").forEach((button) => {
          button.addEventListener("click", () => {
            selectedRepoPath = button.dataset.path || "";
            render(currentStatus, currentDoctor);
            const form = document.getElementById("repoBindingForm");
            if (form) {
              form.elements.path.value = selectedRepoPath;
              form.elements.alias.value = button.dataset.alias || "";
              form.elements.path.focus();
            }
          });
        });

        document.querySelectorAll("[data-action='remove-binding']").forEach((button) => {
          button.addEventListener("click", async () => {
            const path = button.dataset.path || "";
            const alias = button.dataset.alias || "";
            const confirmed = await confirmAction({
              title: "Remove Repository Binding",
              message: `Remove the binding between this repository and '${alias}'?`,
              warning: "The repository will fall back to workspace identity or the global active identity.",
              acceptLabel: "Remove",
              danger: true,
            });
            if (!confirmed) {
              return;
            }
            await runAction(() => api().RemoveRepositoryBinding(path), button, "Removing repository binding");
          });
        });
      }

      function repoBindingPayload(form) {
        const data = new FormData(form);
        return {
          path: String(data.get("path") || "").trim(),
          alias: String(data.get("alias") || "").trim(),
        };
      }

      async function chooseRepositoryPath(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        button.disabled = true;
        try {
          const path = await api().ChooseRepositoryPath();
          if (path) {
            selectedRepoPath = path;
            render(currentStatus, currentDoctor);
          }
        } catch (error) {
          setMessage(actionableError(error), true, "Choose repository failed");
        } finally {
          button.disabled = previousDisabled;
        }
      }

      async function chooseExportPath(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        button.disabled = true;
        try {
          const path = await api().ChooseExportArchivePath();
          if (path) {
            lastExportPath = path;
            render(currentStatus, currentDoctor);
          }
        } catch (error) {
          setMessage(actionableError(error), true, "Choose location failed");
        } finally {
          button.disabled = previousDisabled;
        }
      }

      async function chooseImportPath(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        button.disabled = true;
        try {
          const path = await api().ChooseImportArchivePath();
          if (path) {
            lastImportPath = path;
            render(currentStatus, currentDoctor);
          }
        } catch (error) {
          setMessage(actionableError(error), true, "Choose archive failed");
        } finally {
          button.disabled = previousDisabled;
        }
      }

      async function runBackupAction(action, disabledTarget, actionText) {
        const result = await runAction(action, disabledTarget, actionText);
        return result;
      }

      function showImportSummary(result) {
        const summary = document.getElementById("importSummary");
        if (!summary) {
          notify({
            title: "Backup imported",
            message: importSummaryText(result),
            tone: "success",
            timeout: 0,
          });
          return;
        }
        summary.hidden = false;
        summary.innerHTML = escapeHtml(importSummaryText(result));
        notify({
          title: "Backup imported",
          message: importSummaryText(result),
          tone: "success",
          timeout: 0,
        });
      }

      function importSummaryText(result) {
        const active = result.activeUser ? ` Active: ${result.activeUser}.` : "";
        return `Restored ${result.usersCount || 0} identity(s), ${result.workspacesCount || 0} workspace(s), and ${result.bindingsCount || 0} binding(s).${active}`;
      }

      function findIdentity(alias) {
        return (currentStatus?.identities || []).find((identity) => identity.alias === alias);
      }

      async function copyPublicKey(alias, button) {
        const identity = findIdentity(alias);
        if (!identity?.sshPublicKey) {
          setMessage(`Public key for '${alias}' is not available.`, true, "Public key missing");
          return;
        }
        const previousDisabled = button.disabled;
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = "Copying...";
        try {
          if (window.runtime?.ClipboardSetText) {
            await window.runtime.ClipboardSetText(identity.sshPublicKey);
          } else if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(identity.sshPublicKey);
          } else {
            throw new Error("clipboard is not available");
          }
          notify({
            title: "Public key copied",
            message: `Add '${alias}' to GitHub at github.com/settings/keys.`,
            tone: "success",
          });
        } catch (error) {
          setMessage(`Could not copy public key: ${String(error)}`, true, "Copy failed");
        } finally {
          button.disabled = previousDisabled;
          button.textContent = previousLabel;
        }
      }

      function openEditDialog(alias) {
        const identity = findIdentity(alias);
        if (!identity) {
          setMessage(`Identity '${alias}' not found`, true, "Identity not found");
          return;
        }

        document.getElementById("editAlias").value = identity.alias;
        document.getElementById("editName").value = identity.name;
        document.getElementById("editEmail").value = identity.email;
        document.getElementById("editGitHub").value = identity.githubUsername;
        document.getElementById("editSSHKey").value = identity.sshKeyPath || "";
        document.getElementById("editDialog").showModal();
      }

      function confirmAction({ title, message, warning = "", acceptLabel = "Continue", cancelLabel = "Cancel", danger = false }) {
        const dialog = document.getElementById("confirmDialog");
        const form = document.getElementById("confirmForm");
        const accept = document.getElementById("confirmAccept");
        const cancel = document.getElementById("confirmCancel");
        const warningBox = document.getElementById("confirmWarning");

        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMessage").textContent = message;
        warningBox.textContent = warning;
        warningBox.hidden = !warning;
        accept.textContent = acceptLabel;
        accept.classList.toggle("danger", danger);
        cancel.textContent = cancelLabel;

        return new Promise((resolve) => {
          let settled = false;
          const finish = (value) => {
            if (settled) {
              return;
            }
            settled = true;
            form.removeEventListener("submit", onSubmit);
            cancel.removeEventListener("click", onCancel);
            dialog.removeEventListener("close", onClose);
            if (dialog.open) {
              dialog.close();
            }
            resolve(value);
          };
          const onSubmit = (event) => {
            event.preventDefault();
            finish(true);
          };
          const onCancel = () => finish(false);
          const onClose = () => finish(false);

          form.addEventListener("submit", onSubmit);
          cancel.addEventListener("click", onCancel);
          dialog.addEventListener("close", onClose);
          dialog.showModal();
        });
      }

      async function runAction(action, disabledTarget, actionText = "Working") {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return false;
        }
        setMessage("");
        setActionText(actionText);
        const disabledElements =
          disabledTarget.tagName === "FORM"
            ? Array.from(disabledTarget.querySelectorAll("button, input"))
            : [disabledTarget];
        const previousStates = disabledElements.map((element) => ({
          element,
          disabled: element.disabled,
          label: element.tagName === "BUTTON" ? element.textContent : "",
        }));
        disabledElements.forEach((element) => {
          element.disabled = true;
        });
        if (disabledTarget.tagName === "BUTTON") {
          disabledTarget.textContent = "Working...";
        }
        try {
          const result = await action();
          const doctor = await api().GetDoctorStatus();
          if (result?.status) {
            render(result.status, doctor);
          } else {
            await load();
          }
          setMessage(result?.message || "Done", false, "Action complete");
          return result || true;
        } catch (error) {
          setMessage(actionableError(error), true, "Action failed");
          return false;
        } finally {
          previousStates.forEach(({ element, disabled, label }) => {
            element.disabled = disabled;
            if (element.tagName === "BUTTON") {
              element.textContent = label;
            }
          });
          setActionText("");
        }
      }

      async function runDoctorRefresh(button) {
        if (!api()) {
          setMessage("Desktop backend is not available. Open this screen in the Wails app window.", true, "Backend unavailable");
          return;
        }
        const previousDisabled = button.disabled;
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = "Checking...";
        setActionText("Running diagnostics");
        try {
          const doctor = await api().GetDoctorStatus();
          render(currentStatus, doctor);
          const tone = doctor.errors > 0 ? "error" : doctor.warnings > 0 ? "warn" : "success";
          notify({
            title: "Doctor checks refreshed",
            message:
              doctor.errors > 0
                ? `${doctor.errors} issue(s) need attention. Review the fix hints below.`
                : doctor.warnings > 0
                  ? `${doctor.warnings} warning(s) found. Review the diagnostics below.`
                  : "All visible checks are healthy.",
            tone,
          });
        } catch (error) {
          setMessage(actionableError(error), true, "Doctor failed");
        } finally {
          button.disabled = previousDisabled;
          button.textContent = previousLabel;
          setActionText("");
        }
      }

      function actionableError(error) {
        const message = String(error);
        if (message.includes("not configured")) {
          return `${message} Add your first identity or run bgit setup from the CLI.`;
        }
        if (message.includes("SSH")) {
          return `${message} Check the SSH key path or run Doctor for details.`;
        }
        if (message.includes("git config") || message.includes("identity")) {
          return `${message} Use bgit sync --fix or activate the expected identity.`;
        }
        return message;
      }

      async function load() {
        const target = document.getElementById("app");
        try {
          target.className = "panel";
          target.textContent = "Loading...";
          if (!api()) {
            throw new Error("Desktop backend is not available. Open this screen in the Wails app window.");
          }
          const [status, doctor] = await Promise.all([api().GetStatus(), api().GetDoctorStatus()]);
          render(status, doctor);
        } catch (error) {
          target.textContent = String(error);
          notify({
            title: "Desktop unavailable",
            message: actionableError(error),
            tone: "error",
            timeout: 0,
          });
        }
      }

      document.getElementById("refresh").addEventListener("click", load);
      document.getElementById("cancelEdit").addEventListener("click", () => {
        document.getElementById("editDialog").close();
      });
      document.getElementById("editForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = formPayload(form);
        payload.generateSSHKey = false;
        const saved = await runAction(() => api().UpdateIdentity(payload), form, `Saving ${payload.alias}`);
        if (saved) {
          document.getElementById("editDialog").close();
        }
      });

      load();
    </script>
  </body>
</html>
