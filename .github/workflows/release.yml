name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '\n' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    needs: metadata
    if: needs.metadata.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"

      - name: Build CLI binaries
        run: |

          VERSION=${{ needs.metadata.outputs.version }}

          GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-X github.com/byterings/bgit/cmd.version=$VERSION" -o bgit-windows-arm64.exe .

      - name: Upload CLI release assets
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: |
            bgit-linux-amd64
            bgit-linux-arm64
            bgit-darwin-amd64
            bgit-darwin-arm64
            bgit-windows-amd64.exe
            bgit-windows-arm64.exe

  build-desktop-linux:
    needs: metadata
    if: needs.metadata.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Wails CLI to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build and validate Linux desktop release
        working-directory: desktop
        shell: bash
        run: |
          bash scripts/validate-linux-release.sh "${{ needs.metadata.outputs.version }}"

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-release-assets
          path: |
            desktop/build/bin/bgit-desktop-linux-amd64
            desktop/build/bin/bgit-desktop-linux-amd64.deb

  build-desktop-windows:
    needs: metadata
    if: needs.metadata.outputs.exists == 'false'
    runs-on: windows-latest
    env:
      # Optional code signing. Without these secrets the app and installer
      # are published unsigned.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Wails CLI to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # NSIS ships on the GitHub Windows runner image but is not on PATH.
      # Chocolatey is only a fallback because its community feed
      # intermittently fails with 5xx errors.
      - name: Install NSIS
        shell: bash
        run: |
          if command -v makensis >/dev/null 2>&1; then
            exit 0
          fi
          if [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
            exit 0
          fi
          for attempt in 1 2 3; do
            if choco install nsis -y --no-progress; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "choco install nsis failed after 3 attempts" >&2
              exit 1
            fi
            echo "choco install nsis failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Set product version
        shell: bash
        run: node desktop/build/set-product-version.mjs "${{ needs.metadata.outputs.version }}"

      - name: Build Windows desktop app and installer
        shell: bash
        run: |
          cd desktop
          wails build -platform windows/amd64 -clean -nsis -webview2 download \
            -ldflags "-X github.com/byterings/bgit/cmd.version=${{ needs.metadata.outputs.version }}" \
            -o bgit-desktop-windows-amd64.exe
          ls -la build/bin

      # Signing has to happen in two passes: the app first, then the installer
      # is rebuilt around the signed app and signed itself.
      - name: Sign Windows app and installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $sign = { param($file) & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file; if ($LASTEXITCODE -ne 0) { throw "signing $file failed" } }

          & $sign "desktop\build\bin\bgit-desktop-windows-amd64.exe"

          Push-Location desktop\build\windows\installer
          makensis "-DARG_WAILS_AMD64_BINARY=..\..\bin\bgit-desktop-windows-amd64.exe" project.nsi
          if ($LASTEXITCODE -ne 0) { throw "rebuilding the installer failed" }
          Pop-Location

          & $sign "desktop\build\bin\bgit-amd64-installer.exe"
          Remove-Item $pfx

      - name: Name Windows installer
        shell: bash
        run: mv desktop/build/bin/bgit-amd64-installer.exe desktop/build/bin/bgit-desktop-windows-amd64-installer.exe

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-release-assets
          path: |
            desktop/build/bin/bgit-desktop-windows-amd64.exe
            desktop/build/bin/bgit-desktop-windows-amd64-installer.exe

  build-desktop-macos:
    needs: metadata
    if: needs.metadata.outputs.exists == 'false'
    runs-on: macos-latest
    env:
      # Optional signing and notarization. Without these secrets the app is
      # published unsigned and macOS asks the user to confirm opening it.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Wails CLI to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set product version
        run: node desktop/build/set-product-version.mjs "${{ needs.metadata.outputs.version }}"

      # Packaging is left on so Wails produces build/bin/bgit.app.
      - name: Build macOS desktop app
        run: |
          cd desktop
          wails build -platform darwin/universal -clean \
            -ldflags "-X github.com/byterings/bgit/cmd.version=${{ needs.metadata.outputs.version }}"
          ls -la build/bin
          test -d build/bin/bgit.app

      - name: Sign macOS app
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" desktop/build/bin/bgit.app
          codesign --verify --deep --strict desktop/build/bin/bgit.app
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Create macOS disk image and archive
        run: |
          cd desktop/build/bin
          mkdir dmg
          cp -R bgit.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "bgit" -srcfolder dmg -ov -format UDZO bgit-desktop-darwin-universal.dmg
          ditto -c -k --keepParent bgit.app bgit-desktop-darwin-universal.zip

      - name: Notarize macOS disk image
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          cd desktop/build/bin
          xcrun notarytool submit bgit-desktop-darwin-universal.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple bgit-desktop-darwin-universal.dmg

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-release-assets
          path: |
            desktop/build/bin/bgit-desktop-darwin-universal.dmg
            desktop/build/bin/bgit-desktop-darwin-universal.zip

  release:
    needs:
      - metadata
      - build-cli
      - build-desktop-linux
      - build-desktop-windows
      - build-desktop-macos
    if: needs.metadata.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"

      - name: Generate changelog
        run: go run scripts/generate-changelog.go

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: dist

      - name: Extract release notes
        run: |
          VERSION=${{ needs.metadata.outputs.version }}
          SUMMARY=$(jq -r --arg v "$VERSION" '.releases[] | select(.version == $v) | .summary' changelog.json)
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" = "null" ]; then
            SUMMARY="Release $VERSION"
          fi

          cat > release_notes.md << EOF
          ## bgit v$VERSION

          $SUMMARY

          ### CLI Installation

          **Linux**
          \`\`\`bash
          curl -L https://github.com/byterings/bgit/releases/latest/download/bgit-linux-amd64 -o bgit
          chmod +x bgit
          sudo mv bgit /usr/local/bin/
          \`\`\`

          For ARM devices, use \`bgit-linux-arm64\`.

          **macOS**
          Intel Macs:
          \`\`\`bash
          curl -L https://github.com/byterings/bgit/releases/latest/download/bgit-darwin-amd64 -o bgit
          chmod +x bgit
          sudo mv bgit /usr/local/bin/
          \`\`\`

          Apple Silicon:
          \`\`\`bash
          curl -L https://github.com/byterings/bgit/releases/latest/download/bgit-darwin-arm64 -o bgit
          chmod +x bgit
          sudo mv bgit /usr/local/bin/
          \`\`\`

          **Windows**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/byterings/bgit/main/install.ps1 | iex
          \`\`\`

          ### Desktop App

          The desktop app works on its own; the CLI is not required. Git must be installed. Full guide: https://github.com/byterings/bgit#install

          - **Windows 10/11:** run \`bgit-desktop-windows-amd64-installer.exe\`. If "Windows protected your PC" appears, choose More info, then Run anyway. Without admin rights, use \`bgit-desktop-windows-amd64.exe\` (no installer).
          - **macOS 11 or later (Intel and Apple Silicon):** open \`bgit-desktop-darwin-universal.dmg\` and drag bgit to Applications. If macOS says the app cannot be opened, choose Open Anyway in System Settings, Privacy & Security.
          - **Ubuntu 22.04+, Debian 12+:** \`sudo apt install ./bgit-desktop-linux-amd64.deb\`
          - **Other Linux:** install GTK 3 and WebKitGTK 4.1, then run \`bgit-desktop-linux-amd64\`.

          Also attached: \`bgit-desktop-darwin-universal.zip\` (the macOS app without a disk image).

          See \`changelog.json\` for full details.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: bgit v${{ needs.metadata.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          files: |
            dist/bgit-linux-amd64
            dist/bgit-linux-arm64
            dist/bgit-darwin-amd64
            dist/bgit-darwin-arm64
            dist/bgit-windows-amd64.exe
            dist/bgit-windows-arm64.exe
            dist/bgit-desktop-linux-amd64
            dist/bgit-desktop-linux-amd64.deb
            dist/bgit-desktop-windows-amd64.exe
            dist/bgit-desktop-windows-amd64-installer.exe
            dist/bgit-desktop-darwin-universal.dmg
            dist/bgit-desktop-darwin-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger website rebuild (Cloudflare Pages)
        run: |
          echo "Waiting 5 minutes for GitHub CDN cache to update..."
          sleep 300
          curl -d "" "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
        continue-on-error: true
