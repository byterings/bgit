<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bgit</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <!-- The frame: a top bar with the main navigation, and the current page. -->
    <div class="app">
      <header class="appbar" id="appbar"></header>
      <main class="view" id="view"></main>
    </div>

    <!-- First-run setup guide; covers the app while setup is incomplete. -->
    <div class="ob" id="onboarding" hidden></div>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Order matters: helpers, then the core, then the shell and the pages. -->
    <script src="js/ui.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/core.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/repositories.js"></script>
    <script src="js/repository.js"></script>
    <script src="js/identities.js"></script>
    <script src="js/workspaces.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/onboarding.js"></script>
    <script>
      // A "#page=<id>" or "#repo=<path>" address opens that screen directly;
      // the dev harness uses it to show one screen without clicking through.
      load().then(() => {
        const start = new URLSearchParams(window.location.hash.slice(1));
        if (start.get("repo")) {
          openRepository(start.get("repo"));
        } else if (pages[start.get("page")]) {
          navigate(start.get("page"), { section: start.get("section") || "" });
        }
      });
    </script>
  </body>
</html>
