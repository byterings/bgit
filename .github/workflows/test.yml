name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  e2e:
    name: Docker E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run Docker E2E tests
        run: make e2e

  real-smoke:
    name: Real GitHub Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run optional real smoke tests
        env:
          BGIT_TEST_GITHUB_TOKEN: ${{ secrets.BGIT_TEST_GITHUB_TOKEN }}
          BGIT_TEST_REPO: ${{ secrets.BGIT_TEST_REPO }}
          BGIT_TEST_SSH_KEY_PERSONAL: ${{ secrets.BGIT_TEST_SSH_KEY_PERSONAL }}
          BGIT_TEST_SSH_KEY_WORK: ${{ secrets.BGIT_TEST_SSH_KEY_WORK }}
        run: bash tests/e2e-real/run.sh
